# Optional overlay; does not change the ordinary Compose stack.
x-agent-experiments: &agent-experiments
  SKILLGO_ORCHESTRATION_MODE: ${SKILLGO_ORCHESTRATION_MODE:-audit}
  SKILLGO_CONTEXT_MAX_EXCHANGES: ${SKILLGO_CONTEXT_MAX_EXCHANGES:-}
  SKILLGO_COMPACT_OLDER_TOOLS: ${SKILLGO_COMPACT_OLDER_TOOLS:-}
  SKILLGO_THIN_REFERENCE_SHELF: ${SKILLGO_THIN_REFERENCE_SHELF:-}
  SKILLGO_STATE_INJECT: ${SKILLGO_STATE_INJECT:-false}
  SKILLGO_TOOL_OUTPUT_SPILL: ${SKILLGO_TOOL_OUTPUT_SPILL:-false}
  SKILLGO_TOOL_OUTPUT_SPILL_BYTES: ${SKILLGO_TOOL_OUTPUT_SPILL_BYTES:-32768}
  SKILLGO_AGENT_LOOP_RECOVERY_ENABLED: ${SKILLGO_AGENT_LOOP_RECOVERY_ENABLED:-false}
  SKILLGO_STRUCTURED_COMPACTION_SUMMARY: ${SKILLGO_STRUCTURED_COMPACTION_SUMMARY:-false}
  SKILLGO_PARALLEL_SUBTASKS_ENABLED: ${SKILLGO_PARALLEL_SUBTASKS_ENABLED:-false}
  SKILLGO_PARALLEL_SUBTASKS_JOB_CONCURRENCY: ${SKILLGO_PARALLEL_SUBTASKS_JOB_CONCURRENCY:-5}
  SKILLGO_PARALLEL_SUBTASKS_GLOBAL_MODEL_CONCURRENCY: ${SKILLGO_PARALLEL_SUBTASKS_GLOBAL_MODEL_CONCURRENCY:-10}

services:
  api:
    environment: *agent-experiments
  worker:
    environment: *agent-experiments
