name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿提交真实密钥、用户文件、模型完整输出或未修复漏洞的利用细节。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？你预期发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 执行……
        3. 看到……
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Docker Compose
        - 本地开发环境
        - Linux + gVisor
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 Commit
      placeholder: main / commit SHA
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志或截图
      description: 请先移除邮箱、Token、API Key、文件内容和其他隐私数据。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 Issue，没有发现相同问题。
          required: true
        - label: 我确认内容中不包含真实凭据或用户隐私数据。
          required: true
