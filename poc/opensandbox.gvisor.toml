[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 300
limit_concurrency = 64

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.21"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
port_range_min = 45000
port_range_max = 45100
drop_capabilities = ["ALL"]
no_new_privileges = true
pids_limit = 128
apparmor_profile = ""
seccomp_profile = ""

[storage]
allowed_host_paths = []

[store]
type = "sqlite"
path = "/root/.opensandbox/opensandbox.db"

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.4"
mode = "dns+nft"
disable_ipv6 = true

[secure_runtime]
type = "gvisor"
docker_runtime = "runsc"

[renew_intent]
enabled = false
