apiVersion: skillgo.io/v1alpha1
kind: Skill

metadata:
  name: summary-writer
  version: 1.0.0
  displayName: Summary Writer

spec:
  type: instruction
  inputSchema:
    type: object
    required: [content]
    properties:
      content:
        type: string
        minLength: 1
  outputSchema:
    type: object
    required: [summary, key_points]
    properties:
      summary:
        type: string
      key_points:
        type: array
        items:
          type: string
  permissions:
    tools: []
    network: []
